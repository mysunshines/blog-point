syntax = "proto3";

// ============================================================================
// Point 内部摄入契约（v0）：与对外接口（point.v1.PointService）分离。
// ----------------------------------------------------------------------------
// 约定：所有「服务间内部调用」的 gRPC 接口统一置于 v0 包（point.v0.*），
// 与对外 C 端接口（v1）在命名与部署上彻底隔离：
//   - 公网网关（Gateway）按 DeriveGRPCService 仅代理 *.v1.* 服务，v0 天然不进公网入口；
//   - v0 仅由内网服务经 Consul 直连 gRPC 调用，完全信任内网、不做应用层鉴权，
//     安全性依赖 gRPC 端口仅对内网开放（不暴露公网）。
// ============================================================================

package point.v0;

option go_package = "github.com/mysunshines/blog-point/proto/pb/v0";

// 复用 point.proto（package point.v1）中已定义的消息类型，避免重复定义。
import "point.proto";

// PointIngestService 内部摄入接口（point.v0，仅内网、仅受信服务）：
// 业务方（article/comment/user）上报积分事件、消费积分、查询购买状态。
service PointIngestService {
  // 事件加分：业务服务上报事件，由规则引擎匹配并计分（分值不写死在调用方）。
  rpc EarnPoints(point.v1.EarnPointsRequest) returns (point.v1.EarnPointsResponse);
  // 消费积分：购买付费文章 / 背景等，扣减并记账。
  rpc SpendPoints(point.v1.SpendPointsRequest) returns (point.v1.SpendPointsResponse);
  // 查询用户是否已购买某物品（付费文章 / 背景）。
  rpc HasPurchased(point.v1.HasPurchasedRequest) returns (point.v1.HasPurchasedResponse);
}
